version: '1.0'

services:
  database_vigneto:
    image: postgis/postgis:15-3.3
    container_name: postgis_vigneto
    environment:
      POSTGRES_DB: smart_vineyard
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata_vigneto:/var/lib/postgresql/data

geoserver_vigneto:
    image: geoserver/geoserver:2.35.0
    container_name: geoserver_vigneto
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
    depends_on:
      - database_vigneto

volumes:
  pgdata_vigneto: